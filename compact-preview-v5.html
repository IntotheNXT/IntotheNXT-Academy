    const tr=q('#transfer');if(tr){set(q('.section-head .eyebrow',tr),'The solution');set(q('.section-head h2',tr),'The learning continues in the work.');const p=q('.section-head>p',tr);if(p)p.textContent='A method-specific AI learning coach, embedded in the employee’s Microsoft Copilot or Claude chat, stays available when the actual task appears, challenges the user and helps train human judgement.';const old=q('.transfer-row.traditional .transfer-flow',tr);if(old)old.innerHTML='<span>Workshop</span><b>→</b><span>Workbook or deck</span><b>→</b><span>Daily work takes over</span>';const nw=q('.transfer-row.nxt .transfer-flow',tr);if(nw)nw.innerHTML='<span>Learn it</span><b>→</b><span>Apply it</span><b>→</b><span>Train human judgement</span><b>→</b><span>Repeat &amp; improve</span>';const cp=q('.transfer-copy',tr);if(cp)cp.innerHTML='<div class="transfer-points"><div><strong>1 · Learn the method</strong><span>Understand the principles and why the method works.</span></div><div><strong>2 · Apply it in real work</strong><span>The learning coach guides the method when the actual task appears.</span></div><div class="judgement-step"><strong>3 · Train human judgement</strong><span>At defined points, the coach asks the manager or team to decide, so judgement continues to develop.</span><span class="checkpoint">Human checkpoint</span></div><div><strong>4 · Repeat &amp; improve</strong><span>The method remains available for recurring use and agent improvement.</span></div></div>'}

nvas?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true" target="_blank" rel="noopener noreferrer">Try the OKR Coach in Microsoft Copilot →</a><a class="btn btn-secondary" href="https://copilotstudio.microsoft.com/environments/Default-c6453d07-bd3d-4a29-849d-0688f52a3b2d/bots/cr428_ogsmcoach-demo_Gzl0o5/canvas?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true" target="_blank" rel="noopener noreferrer">Try the OGSM Coach in Microsoft Copilot →</a></div><p class="demo-safety"><strong>Public demos.</strong> Do not enter confidential company information.</p></div><div class="skill-window"><div class="skill-window-top"><span></span><span></span><span></span><em>OKR_Coach.agent</em></div><pre>01  Understand strategic context\n02  Draft Objective options\n03  Challenge weak reasoning\n04  HUMAN CHECKPOINT: choose direction\n05  Build measurable Key Results\n06  Challenge activities vs outcomes\n07  HUMAN CHECKPOINT: approve trade-offs\n08  Review progress and learn</pre></div></div></div>')}

and values that should be preserved, and translate that tension into strategic choices, innovation priorities and the capabilities required to stimulate progress.')}}
